
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test: ¿Qué Digimon eres?</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; background: #f0f4f8; }
    h1 { text-align: center; }
    .question { margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .options label { display: block; margin: 5px 0; cursor: pointer; }
    #result { font-size: 1.2em; font-weight: bold; text-align: center; margin-top: 30px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 1em; cursor: pointer; }
  </style>
</head>
<body>
  <h1>¿Qué Digimon eres?</h1>
  <form id="quizForm"></form>
  <button onclick="calculateResult()">Ver mi resultado</button>
  <div id="result"></div>
  <script>
    const digimonPoints = {
      Agumon: 0, Gabumon: 0, Patamon: 0, Gatomon: 0, Tentomon: 0,
      Palmon: 0, Gomamon: 0, Piyomon: 0
    };
    const questions = [...];  // El contenido ya está en el documento, se asume copiado completo aquí
    const form = document.getElementById('quizForm');
    questions.forEach((q, index) => {
      const div = document.createElement('div');
      div.className = 'question';
      div.innerHTML = `<p><strong>${index + 1}. ${q.q}</strong></p>`;
      q.options.forEach((opt, i) => {
        const id = `q${index}_opt${i}`;
        div.innerHTML += `
          <label><input type="radio" name="q${index}" value='${JSON.stringify(opt.values)}'> ${opt.text}</label>`;
      });
      form.appendChild(div);
    });
    function calculateResult() {
      const formData = new FormData(form);
      const selectedQuestions = new Set();
      for (const [key, val] of formData.entries()) {
        selectedQuestions.add(key);
        const selected = JSON.parse(val);
        selected.forEach(d => digimonPoints[d]++);
      }
      if (selectedQuestions.size < questions.length) {
        document.getElementById('result').textContent = 'Por favor, responde todas las preguntas.';
        return;
      }
      let topScore = 0;
      let topDigimon = '';
      for (const [digimon, score] of Object.entries(digimonPoints)) {
        if (score > topScore) {
          topScore = score;
          topDigimon = digimon;
        }
      }
      document.getElementById('result').textContent = `¡Tu Digimon es ${topDigimon}!`;
    }
  </script>
</body>
</html>
